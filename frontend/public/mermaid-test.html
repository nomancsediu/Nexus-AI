<!DOCTYPE html>
<html>
<head>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
    mermaid.initialize({ startOnLoad: false, theme: 'dark' })

    const code = `graph TD
    A[Input Size] --> B[Algorithm]
    B --> C[Time Complexity]
    C --> D[O1 Constant]
    C --> E[Ologn Logarithmic]
    C --> F[On Linear]
    C --> G[On2 Quadratic]`

    const el = document.createElement('div')
    el.id = 'test'
    el.style.cssText = 'position:absolute;top:-9999px'
    document.body.appendChild(el)

    mermaid.render('test', code)
      .then(({ svg }) => {
        document.getElementById('output').innerHTML = svg
        document.getElementById('status').textContent = 'SUCCESS'
        document.getElementById('status').style.color = 'lime'
      })
      .catch(err => {
        document.getElementById('status').textContent = 'ERROR: ' + err.message
        document.getElementById('status').style.color = 'red'
        console.error(err)
      })
      .finally(() => el.remove())
  </script>
</head>
<body style="background:#111;color:#fff;padding:20px;font-family:monospace">
  <div id="status" style="margin-bottom:20px;font-size:14px">Rendering...</div>
  <div id="output"></div>
</body>
</html>
