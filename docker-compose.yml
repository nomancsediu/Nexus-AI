services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
